{% load static %}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Partition Musique{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <nav class="site-nav">
      <a class="brand" href="{% url 'accueil' %}">Partition Musique</a>
      <div class="nav-actions">
        {% if user.is_authenticated %}
          <div class="nav-links">
            <a class="nav-button" href="{% url 'accueil' %}">Accueil</a>
            <a class="nav-button" href="{% url 'historique' %}">Historique</a>
          </div>
        {% endif %}
      </div>
      <div class="nav-user">
        {% if user.is_authenticated %}
          <span>Bonjour, {{ user.username }}</span>
          <form method="post" action="{% url 'deconnexion' %}">
            {% csrf_token %}
            <button class="link-button" type="submit">Déconnexion</button>
          </form>
        {% else %}
          <a href="{% url 'connexion' %}">Connexion</a>
        {% endif %}
      </div>
    </nav>
    <main>
      {% block content %}
      {% endblock %}
    </main>
  </body>
</html>
