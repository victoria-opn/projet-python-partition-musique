services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
  web:
    image: ghcr.io/victoria-opn/projet-python-partition-musique:latest
    build:
      context: .
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
      DJANGO_SUPERUSER_USERNAME: "${DJANGO_SUPERUSER_USERNAME}"
      DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD}"
      DB_HOST: db
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      STATIC_ROOT: /static
      MEDIA_ROOT: /media
    volumes:
      - static:/static
      - media:/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request as u;
          u.urlopen("http://localhost:8000/health/")
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s
  proxy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/static:ro
      - media:/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  static:
  media: